name: Release

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing or new release tag that receives the verified native seeds
                required: true
                default: v0.1.1
                type: string
            publish:
                description: Upload verified seeds to the designated GitHub release
                required: true
                default: false
                type: boolean
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    validate-source:
        name: Validate release source
        runs-on: ubuntu-latest

        steps:
            -   name: Require the default branch for manual publication
                env:
                    EVENT_NAME: ${{ github.event_name }}
                    SOURCE_REF: ${{ github.ref }}
                run: |
                    if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${SOURCE_REF}" != "refs/heads/main" ]]; then
                        echo "::error::Native seeds may only be published manually from main."
                        exit 1
                    fi

    build:
        name: Build (${{ matrix.platform }})
        needs: validate-source
        runs-on: ${{ matrix.runner }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   runner: ubuntu-24.04
                        platform: linux-x86_64
                        gradle: ./gradlew
                        java_distribution: temurin
                        linker: clang

                    -   runner: ubuntu-24.04-arm
                        platform: linux-arm64
                        gradle: ./gradlew
                        java_distribution: temurin
                        linker: clang

                    -   runner: macos-15-intel
                        platform: macosx-x86_64
                        gradle: ./gradlew
                        java_distribution: temurin
                        linker: clang

                    -   runner: macos-15
                        platform: macosx-arm64
                        gradle: ./gradlew
                        java_distribution: temurin
                        linker: clang

                    -   runner: windows-2025
                        platform: windows-x86_64
                        gradle: ./gradlew.bat
                        java_distribution: temurin
                        linker: C:\Program Files\LLVM\bin\clang.exe

                    -   runner: windows-11-arm
                        platform: windows-arm64
                        gradle: ./gradlew.bat
                        java_distribution: zulu
                        linker: C:\Program Files\LLVM\bin\clang.exe

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Set up Java 25
                uses: actions/setup-java@v5
                with:
                    distribution: ${{ matrix.java_distribution }}
                    java-version: "25"

            -   name: Build and smoke-test distribution
                working-directory: compiler
                env:
                    ORG_GRADLE_PROJECT_solNativePlatform: ${{ matrix.platform }}
                    SOL_LINKER: ${{ matrix.linker }}
                run: >
                    ${{ matrix.gradle }}
                    clean
                    test
                    distributionSmokeTest
                    assembleDist

            -   name: Download trusted Sol 0.1.1 compiler
                env:
                    GH_TOKEN: ${{ github.token }}
                    SOL_SEED_TARGET: ${{ matrix.platform }}
                run: python selfhost/seed/download.py

            -   name: Build and verify reproducible native seed
                env:
                    SOL_LINKER: ${{ matrix.linker }}
                    SOL_SEED_TARGET: ${{ matrix.platform }}
                run: |
                    python selfhost/seed/test_seed.py
                    python selfhost/seed/build.py

            -   name: Upload native seed release asset
                uses: actions/upload-artifact@v7
                with:
                    name: seed-${{ matrix.platform }}
                    path: |
                        selfhost/build/seed artifacts/dist/sol-bootstrap-*-${{ matrix.platform }}*
                    if-no-files-found: error
                    compression-level: 0
                    retention-days: 7

    publish:
        name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        needs: build
        runs-on: ubuntu-latest

        env:
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

        permissions:
            contents: write

        steps:
            -   name: Checkout release sources
                uses: actions/checkout@v6

            -   name: Download release assets
                uses: actions/download-artifact@v8
                with:
                    pattern: seed-*
                    path: dist
                    merge-multiple: true

            -   name: Verify release assets
                shell: bash
                run: |
                    set -euo pipefail

                    version="${RELEASE_TAG#v}"
                    metadata_version="$(python -c 'import json; print(json.load(open("selfhost/seed/metadata.json"))["version"])')"

                    if [[ "${RELEASE_TAG}" != "v${metadata_version}" || "${version}" != "${metadata_version}" ]]; then
                        echo "::error::Tag ${RELEASE_TAG} does not match seed metadata ${metadata_version}."
                        exit 1
                    fi

                    expected_seeds=(
                        "sol-bootstrap-${version}-linux-x86_64.tar.gz"
                        "sol-bootstrap-${version}-linux-arm64.tar.gz"
                        "sol-bootstrap-${version}-macosx-x86_64.tar.gz"
                        "sol-bootstrap-${version}-macosx-arm64.tar.gz"
                        "sol-bootstrap-${version}-windows-x86_64.zip"
                        "sol-bootstrap-${version}-windows-arm64.zip"
                    )

                    for asset in "${expected_seeds[@]}"; do
                        if [[ ! -f "dist/${asset}" ]]; then
                            echo "::error::Missing release asset: ${asset}"
                            exit 1
                        fi
                    done

                    targets=(
                        linux-x86_64
                        linux-arm64
                        macosx-x86_64
                        macosx-arm64
                        windows-x86_64
                        windows-arm64
                    )

                    for target in "${targets[@]}"; do
                        provenance="sol-bootstrap-${version}-${target}.provenance.json"
                        if [[ ! -f "dist/${provenance}" ]]; then
                            echo "::error::Missing release provenance: ${provenance}"
                            exit 1
                        fi
                    done

            -   name: Generate SHA-256 checksums
                working-directory: dist
                run: sha256sum sol-bootstrap-*.tar.gz sol-bootstrap-*.zip | sort -k2 > SHA256SUMS

            -   name: Record bootstrap seed provenance
                shell: bash
                run: |
                    cat > dist/NATIVE-SEED-PROVENANCE.txt <<EOF
                    Sol 0.1.1 bootstrap seed
                    tag: ${RELEASE_TAG}
                    commit: ${GITHUB_SHA}
                    repository: https://github.com/${GITHUB_REPOSITORY}
                    workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
                    builders: GitHub-hosted runners, Java 25, Gradle wrapper
                    targets: linux-x86_64, linux-arm64, macosx-x86_64, macosx-arm64, windows-x86_64, windows-arm64
                    checksums: SHA256SUMS
                    artifact type: native stage-3 bootstrap seeds (no JVM)
                    EOF

            -   name: Publish release
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                        existing_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
                        for asset in dist/*; do
                            name="$(basename "${asset}")"
                            if grep -Fx -- "${name}" <<<"${existing_assets}" >/dev/null; then
                                echo "::error::Release asset already exists and will not be overwritten: ${name}"
                                exit 1
                            fi
                        done
                        gh release upload "${RELEASE_TAG}" \
                            dist/* \
                            --repo "${GITHUB_REPOSITORY}"
                        gh release edit "${RELEASE_TAG}" \
                            --repo "${GITHUB_REPOSITORY}" \
                            --title "Sol ${RELEASE_TAG#v}" \
                            --notes-file docs/releases/sol-0.1.1.md
                    else
                        gh release create "${RELEASE_TAG}" \
                            dist/* \
                            --repo "${GITHUB_REPOSITORY}" \
                            --verify-tag \
                            --title "Sol ${RELEASE_TAG#v}" \
                            --notes-file docs/releases/sol-0.1.1.md
                    fi
