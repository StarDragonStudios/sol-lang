name: Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    build:
        name: Build (${{ matrix.platform }})
        runs-on: ${{ matrix.runner }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   runner: ubuntu-24.04
                        platform: linux-x86_64
                        gradle: ./gradlew
                        java_distribution: temurin
                        asset: sol-0.1.0-linux-x86_64.tar.gz

                    -   runner: ubuntu-24.04-arm
                        platform: linux-arm64
                        gradle: ./gradlew
                        java_distribution: temurin
                        asset: sol-0.1.0-linux-arm64.tar.gz

                    -   runner: macos-15-intel
                        platform: macosx-x86_64
                        gradle: ./gradlew
                        java_distribution: temurin
                        asset: sol-0.1.0-macosx-x86_64.tar.gz

                    -   runner: macos-15
                        platform: macosx-arm64
                        gradle: ./gradlew
                        java_distribution: temurin
                        asset: sol-0.1.0-macosx-arm64.tar.gz

                    -   runner: windows-2025
                        platform: windows-x86_64
                        gradle: ./gradlew.bat
                        java_distribution: temurin
                        asset: sol-0.1.0-windows-x86_64.zip

                    -   runner: windows-11-arm
                        platform: windows-arm64
                        gradle: ./gradlew.bat
                        java_distribution: zulu
                        asset: sol-0.1.0-windows-arm64.zip

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Set up Java 25
                uses: actions/setup-java@v5
                with:
                    distribution: ${{ matrix.java_distribution }}
                    java-version: "25"

            -   name: Build and smoke-test distribution
                working-directory: compiler
                env:
                    ORG_GRADLE_PROJECT_solNativePlatform: ${{ matrix.platform }}
                run: >
                    ${{ matrix.gradle }}
                    clean
                    test
                    distributionSmokeTest
                    assembleDist

            -   name: Upload release asset
                uses: actions/upload-artifact@v7
                with:
                    name: release-${{ matrix.platform }}
                    path: compiler/build/distributions/${{ matrix.asset }}
                    if-no-files-found: error
                    compression-level: 0
                    retention-days: 7

    publish:
        name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            -   name: Download release assets
                uses: actions/download-artifact@v8
                with:
                    pattern: release-*
                    path: dist
                    merge-multiple: true

            -   name: Verify release assets
                shell: bash
                run: |
                    set -euo pipefail

                    version="${GITHUB_REF_NAME#v}"

                    expected=(
                        "sol-${version}-linux-x86_64.tar.gz"
                        "sol-${version}-linux-arm64.tar.gz"
                        "sol-${version}-macosx-x86_64.tar.gz"
                        "sol-${version}-macosx-arm64.tar.gz"
                        "sol-${version}-windows-x86_64.zip"
                        "sol-${version}-windows-arm64.zip"
                    )

                    for asset in "${expected[@]}"; do
                        if [[ ! -f "dist/${asset}" ]]; then
                            echo "::error::Missing release asset: ${asset}"
                            exit 1
                        fi
                    done

            -   name: Generate SHA-256 checksums
                working-directory: dist
                run: sha256sum sol-* > SHA256SUMS.txt

            -   name: Publish release
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    gh release create "${GITHUB_REF_NAME}" \
                        dist/* \
                        --verify-tag \
                        --title "Sol ${GITHUB_REF_NAME#v}" \
                        --generate-notes
