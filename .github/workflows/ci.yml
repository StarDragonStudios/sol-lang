name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    repository-checks:
        name: Repository checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Verify repository layout
              run: |
                  test -f README.md
                  test -f LICENSE
                  test -f .editorconfig
                  test -f spec/sol-0.1.md
                  test -d compiler
                  test -d runtime-c
                  test -d examples
                  test -d tests

    compiler-tests:
        name: Compiler tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 26
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "26"

            - name: Run compiler tests
              working-directory: compiler
              run: ./gradlew test

    distribution-tests:
        name: Distribution (${{ matrix.platform }})
        runs-on: ${{ matrix.runner }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   runner: ubuntu-24.04
                        platform: linux-x86_64
                        gradle: ./gradlew

                    -   runner: ubuntu-24.04-arm
                        platform: linux-arm64
                        gradle: ./gradlew

                    -   runner: macos-15-intel
                        platform: macosx-x86_64
                        gradle: ./gradlew

                    -   runner: macos-15
                        platform: macosx-arm64
                        gradle: ./gradlew

                    -   runner: windows-2025
                        platform: windows-x86_64
                        gradle: ./gradlew.bat

                    -   runner: windows-11-arm
                        platform: windows-arm64
                        gradle: ./gradlew.bat

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Set up Java 26
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "26"

            -   name: Build and smoke-test distribution
                working-directory: compiler
                run: >
                    ${{ matrix.gradle }}
                    distributionSmokeTest
                    assembleDist
                    -Psol.nativePlatform=${{ matrix.platform }}
