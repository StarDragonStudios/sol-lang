name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Keep only the latest CI run per PR, including after stack retargeting.
# Non-PR runs have unique groups so pushes to main never cancel each other.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    repository-checks:
        name: Repository checks
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Verify promoted compiler layout
                run: |
                    test -f README.md
                    test -f LICENSE
                    test -f .editorconfig
                    test -f spec/sol-0.1.md
                    test -d compiler
                    test -f compiler/src/main.sol
                    test -f compiler/bootstrap.sh
                    test -f compiler/bootstrap.bat
                    test -f compiler/README.md
                    test -f compiler/repeated-bootstrap/run.py
                    test -f compiler/seed/build.py
                    test -f compiler/seed/download.py
                    test -f compiler/seed/metadata.json
                    test -d compiler/stdlib
                    test -d runtime-c
                    test -d examples
                    test -d tests

                    if find . -path ./.git -prune -o -type f \( -name '*.java' -o -name '*.class' -o -name '*.jar' -o -name 'gradlew' -o -name 'gradlew.bat' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | grep -q .; then
                        echo "::error::The active repository contains a Java or Gradle compiler artifact."
                        exit 1
                    fi

            -   name: Test bootstrap orchestration
                run: |
                    python compiler/seed/test_seed.py
                    python compiler/conformance/test_conformance.py

    compiler-bootstrap:
        name: Compiler bootstrap (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 180

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Download verified native Sol 0.1.1 seed
                env:
                    GH_TOKEN: ${{ github.token }}
                    SOL_SEED_TARGET: linux-x86_64
                run: python compiler/seed/download.py

            -   name: Bootstrap and test official compiler
                run: ./compiler/bootstrap.sh

    compiler-bootstrap-windows:
        name: Compiler bootstrap (Windows)
        runs-on: windows-2025
        timeout-minutes: 180

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Download verified native Sol 0.1.1 seed
                env:
                    GH_TOKEN: ${{ github.token }}
                    SOL_SEED_TARGET: windows-x86_64
                run: python compiler/seed/download.py

            -   name: Verify Windows native linker
                shell: pwsh
                run: |
                    if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
                        throw "LLVM clang.exe was not found on the Windows runner."
                    }

            -   name: Bootstrap and test official compiler
                shell: cmd
                env:
                    SOL_LINKER: C:\Program Files\LLVM\bin\clang.exe
                run: compiler\bootstrap.bat

    compiler-fixed-point:
        name: Compiler fixed point (Linux)
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Download verified native Sol 0.1.1 seed
                env:
                    GH_TOKEN: ${{ github.token }}
                    SOL_SEED_TARGET: linux-x86_64
                run: python compiler/seed/download.py

            -   name: Prove repeated-bootstrap fixed point
                run: ./compiler/repeated-bootstrap/run.sh

    native-distributions:
        name: Native distribution (${{ matrix.platform }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 90

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   runner: ubuntu-24.04
                        platform: linux-x86_64
                        linker: clang

                    -   runner: ubuntu-24.04-arm
                        platform: linux-arm64
                        linker: clang

                    -   runner: macos-15-intel
                        platform: macosx-x86_64
                        linker: clang

                    -   runner: macos-15
                        platform: macosx-arm64
                        linker: clang

                    -   runner: windows-2025
                        platform: windows-x86_64
                        linker: C:\Program Files\LLVM\bin\clang.exe

                    -   runner: windows-11-arm
                        platform: windows-arm64
                        linker: C:\Program Files\LLVM\bin\clang.exe

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Download verified native Sol 0.1.1 seed
                env:
                    GH_TOKEN: ${{ github.token }}
                    SOL_SEED_TARGET: ${{ matrix.platform }}
                run: python compiler/seed/download.py

            -   name: Build and verify reproducible native compiler
                env:
                    SOL_LINKER: ${{ matrix.linker }}
                    SOL_SEED_TARGET: ${{ matrix.platform }}
                run: |
                    python compiler/seed/test_seed.py
                    python compiler/seed/build.py

            -   name: Retain verified native compiler
                uses: actions/upload-artifact@v7
                with:
                    name: compiler-${{ matrix.platform }}
                    path: compiler/build/seed artifacts/dist/*
                    if-no-files-found: error
                    compression-level: 0
                    retention-days: 7
